; hdmi-ddc-input-switch — Adafruit Feather RP2040 DVI
;
; Uses the maxgerhardt platform fork: the official `raspberrypi` platform only ships
; Arduino-Mbed. Pinned to a known-good commit; that commit in turn pins the
; earlephilhower Arduino core (framework-arduinopico 1.60100.0, fd65f6d). Libraries
; are pinned to exact versions so builds are reproducible.

[env:feather_dvi]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = adafruit_feather_dvi
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
extra_scripts = pre:tools/version.py
lib_deps =
    adafruit/PicoDVI - Adafruit Fork@1.3.2
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.3
