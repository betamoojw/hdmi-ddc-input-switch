<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Key wiring</title>
  <desc id="d">Each of the four keys has one pin wired to its own Feather pin (A0, A1, A2, A3) and its other pin wired to a common GND.</desc>
  <rect width="900" height="530" rx="14" fill="#f7f8fa"/>

  <!-- Feather -->
  <rect x="40" y="70" width="300" height="290" rx="16" fill="#23233f"/>
  <text x="190" y="110" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Feather RP2040 DVI</text>
  <text x="190" y="134" fill="#b8bccc" font-size="14" text-anchor="middle">no headers: solder wires into the holes</text>
  <g font-size="17" font-weight="700" fill="#23233f">
    <rect x="250" y="165" width="80" height="30" rx="6" fill="#f2a33a"/><text x="290" y="186" text-anchor="middle">A0</text>
    <rect x="250" y="205" width="80" height="30" rx="6" fill="#4fa3e0"/><text x="290" y="226" text-anchor="middle">A1</text>
    <rect x="250" y="245" width="80" height="30" rx="6" fill="#5cc28a"/><text x="290" y="266" text-anchor="middle">A2</text>
    <rect x="250" y="285" width="80" height="30" rx="6" fill="#d97bd0"/><text x="290" y="306" text-anchor="middle">A3</text>
    <rect x="250" y="325" width="80" height="30" rx="6" fill="#ffffff" stroke="#23233f" stroke-width="2"/><text x="290" y="346" text-anchor="middle">GND</text>
  </g>

  <!-- signal wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 180 H420 V100 H480" stroke="#f2a33a"/>
    <path d="M330 220 H440 V180 H480" stroke="#4fa3e0"/>
    <path d="M330 260 H460 H480" stroke="#5cc28a"/>
    <path d="M330 300 H440 V340 H480" stroke="#d97bd0"/>
  </g>

  <!-- GND bus -->
  <g fill="none" stroke="#2b2f36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 340 H400 V400 H700 V128 H660"/>
    <path d="M700 208 H660"/>
    <path d="M700 288 H660"/>
    <path d="M700 368 H660"/>
  </g>
  <text x="712" y="404" font-size="14" fill="#2b2f36">GND (shared)</text>

  <!-- keys: two pins each -->
  <g font-size="16" fill="#1d2128">
    <g>
      <rect x="480" y="78" width="180" height="64" rx="10" fill="#ffffff" stroke="#9aa3ad" stroke-width="2"/>
      <text x="570" y="106" text-anchor="middle" font-weight="700">Key 1</text>
      <text x="570" y="128" text-anchor="middle" font-size="14" fill="#5f6672">e.g. HDMI 1</text>
      <circle cx="480" cy="100" r="6" fill="#f2a33a"/><circle cx="660" cy="128" r="6" fill="#2b2f36"/>
    </g>
    <g>
      <rect x="480" y="158" width="180" height="64" rx="10" fill="#ffffff" stroke="#9aa3ad" stroke-width="2"/>
      <text x="570" y="186" text-anchor="middle" font-weight="700">Key 2</text>
      <text x="570" y="208" text-anchor="middle" font-size="14" fill="#5f6672">e.g. HDMI 2</text>
      <circle cx="480" cy="180" r="6" fill="#4fa3e0"/><circle cx="660" cy="208" r="6" fill="#2b2f36"/>
    </g>
    <g>
      <rect x="480" y="238" width="180" height="64" rx="10" fill="#ffffff" stroke="#9aa3ad" stroke-width="2"/>
      <text x="570" y="266" text-anchor="middle" font-weight="700">Key 3</text>
      <text x="570" y="288" text-anchor="middle" font-size="14" fill="#5f6672">e.g. DP</text>
      <circle cx="480" cy="260" r="6" fill="#5cc28a"/><circle cx="660" cy="288" r="6" fill="#2b2f36"/>
    </g>
    <g>
      <rect x="480" y="318" width="180" height="64" rx="10" fill="#ffffff" stroke="#9aa3ad" stroke-width="2"/>
      <text x="570" y="346" text-anchor="middle" font-weight="700">Key 4</text>
      <text x="570" y="368" text-anchor="middle" font-size="14" fill="#5f6672">e.g. USB-C</text>
      <circle cx="480" cy="340" r="6" fill="#d97bd0"/><circle cx="660" cy="368" r="6" fill="#2b2f36"/>
    </g>
  </g>

  <text x="40" y="44" font-size="18" font-weight="700" fill="#1d2128">Keys, left to right</text>
  <text x="760" y="140" font-size="13" fill="#5f6672">Either switch</text>
  <text x="760" y="158" font-size="13" fill="#5f6672">pin works for</text>
  <text x="760" y="176" font-size="13" fill="#5f6672">either wire.</text>
  <!-- notes, below the wiring -->
  <line x1="40" y1="432" x2="860" y2="432" stroke="#d5d9df" stroke-width="1.5"/>
  <g font-size="14" fill="#5f6672">
    <text x="40" y="460"><tspan font-weight="700" fill="#1d2128">Use A0–A3 if you can.</tspan> They're the defaults, so the keys work with no setup and keep</text>
    <text x="40" y="480">working after a factory reset. They sit in a row next to GND. Other free pins work too: pick them in Configure.</text>
    <text x="40" y="510"><tspan font-weight="700" fill="#1d2128">Inputs are examples.</tspan> A key can go to any input your monitor has, or do something else.</text>
  </g>
</svg>
